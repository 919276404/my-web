<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门监督抽检数据填报</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .filter-section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-item label {
            font-weight: 500;
            min-width: 100px;
        }
        .filter-item input, .filter-item select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #1890ff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #40a9ff;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-left: 10px;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-success {
            background: #52c41a;
            color: #fff;
        }
        .btn-success:hover {
            background: #73d13d;
        }
        .table-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .table-scroll {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 500px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-pending {
            background: #fff7e6;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }
        .status-completed {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 0 0 auto;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }
        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #666;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1 1 auto;
        }
        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex: 0 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .stats-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .stats-header {
            font-weight: 600;
            margin-bottom: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #1890ff;
        }
        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="stats-card">
        <div class="stats-header">填报统计</div>
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="totalPlan">0</div>
                <div class="stat-label">监督抽检计划总数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalActual">0</div>
                <div class="stat-label">监督抽检实际完成数</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="completionRate">0%</div>
                <div class="stat-label">完成率</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="reportCount">0</div>
                <div class="stat-label">已填报部门数</div>
            </div>
        </div>
    </div>

    <div class="filter-section">
        <div class="filter-row">
            <div class="filter-item">
                <label>任务年度：</label>
                <select id="taskYear">
                    <option value="">全部</option>
                    <option value="2026">2026年</option>
                    <option value="2025">2025年</option>
                </select>
            </div>
            <div class="filter-item">
                <label>填报部门：</label>
                <select id="deptName">
                    <option value="">全部</option>
                    <option value="东城区市场监管局">东城区市场监管局</option>
                    <option value="西城区市场监管局">西城区市场监管局</option>
                    <option value="朝阳区市场监管局">朝阳区市场监管局</option>
                    <option value="海淀区市场监管局">海淀区市场监管局</option>
                    <option value="丰台区市场监管局">丰台区市场监管局</option>
                </select>
            </div>
            <div class="filter-item">
                <label>填报状态：</label>
                <select id="reportStatus">
                    <option value="">全部</option>
                    <option value="未填报">未填报</option>
                    <option value="已填报">已填报</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="searchData()">查询</button>
            <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h3>监督抽检数据填报列表</h3>
            <div>
                <button class="btn btn-success" onclick="fillReport()">填报数据</button>
                <button class="btn btn-secondary" onclick="exportData()" style="margin-left: 10px;">导出数据</button>
            </div>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>报送批次号</th>
                        <th>填报部门</th>
                        <th>任务年度</th>
                        <th>监督抽检计划数</th>
                        <th>监督抽检实际完成数</th>
                        <th>完成率</th>
                        <th>填报状态</th>
                        <th>填报人</th>
                        <th>填报时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="reportTable">
                </tbody>
            </table>
        </div>
    </div>

    <div id="fillModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">监督抽检数据填报</div>
                <div class="modal-close" onclick="closeFillModal()">×</div>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalId" value="">
                <div class="form-row">
                    <div class="form-group">
                        <label>任务年度</label>
                        <select id="fillYear">
                            <option value="2026">2026年</option>
                            <option value="2025">2025年</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>填报部门</label>
                        <select id="fillDept">
                            <option value="东城区市场监管局">东城区市场监管局</option>
                            <option value="西城区市场监管局">西城区市场监管局</option>
                            <option value="朝阳区市场监管局">朝阳区市场监管局</option>
                            <option value="海淀区市场监管局">海淀区市场监管局</option>
                            <option value="丰台区市场监管局">丰台区市场监管局</option>
                            <option value="石景山区市场监管局">石景山区市场监管局</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>监督抽检计划数</label>
                        <input type="number" id="planCount" placeholder="请输入计划数" min="0">
                    </div>
                    <div class="form-group">
                        <label>监督抽检实际完成数</label>
                        <input type="number" id="actualCount" placeholder="请输入实际完成数" min="0">
                    </div>
                </div>
                <div class="form-group">
                    <label>填报人</label>
                    <input type="text" id="fillPerson" placeholder="请输入填报人姓名">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="fillRemark" placeholder="请输入备注信息"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeFillModal()">取消</button>
                <button class="btn btn-primary" onclick="saveReport()">提交</button>
            </div>
        </div>
    </div>

    <script>
        var reportData = [
            { id: 1, batchNo: 'BS2026001', deptName: '东城区市场监管局', taskYear: '2026', planCount: 1000, actualCount: 950, status: '已填报', fillPerson: '张三', fillTime: '2026-01-15 10:30' },
            { id: 2, batchNo: 'BS2026002', deptName: '西城区市场监管局', taskYear: '2026', planCount: 800, actualCount: 780, status: '已填报', fillPerson: '李四', fillTime: '2026-01-16 14:20' },
            { id: 3, batchNo: 'BS2026003', deptName: '朝阳区市场监管局', taskYear: '2026', planCount: 1200, actualCount: 1100, status: '已填报', fillPerson: '王五', fillTime: '2026-01-17 09:15' },
            { id: 4, batchNo: '', deptName: '海淀区市场监管局', taskYear: '2026', planCount: 0, actualCount: 0, status: '未填报', fillPerson: '', fillTime: '' },
            { id: 5, batchNo: '', deptName: '丰台区市场监管局', taskYear: '2026', planCount: 0, actualCount: 0, status: '未填报', fillPerson: '', fillTime: '' },
            { id: 6, batchNo: 'BS2025001', deptName: '东城区市场监管局', taskYear: '2025', planCount: 900, actualCount: 880, status: '已填报', fillPerson: '张三', fillTime: '2025-01-18 11:00' },
            { id: 7, batchNo: 'BS2025002', deptName: '西城区市场监管局', taskYear: '2025', planCount: 750, actualCount: 720, status: '已填报', fillPerson: '李四', fillTime: '2025-01-19 15:30' }
        ];

        function init() {
            renderTable(reportData);
            updateStats();
        }

        function renderTable(data) {
            var tbody = document.getElementById('reportTable');
            tbody.innerHTML = '';
            data.forEach(function(item, index) {
                var completionRate = item.planCount > 0 ? Math.round((item.actualCount / item.planCount) * 100) : 0;
                var statusClass = item.status === '已填报' ? 'status-completed' : 'status-pending';

                var row = '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + (item.batchNo || '-') + '</td>' +
                    '<td>' + item.deptName + '</td>' +
                    '<td>' + item.taskYear + '年</td>' +
                    '<td>' + item.planCount + '</td>' +
                    '<td>' + item.actualCount + '</td>' +
                    '<td>' + completionRate + '%</td>' +
                    '<td><span class="status-tag ' + statusClass + '">' + item.status + '</span></td>' +
                    '<td>' + (item.fillPerson || '-') + '</td>' +
                    '<td>' + (item.fillTime || '-') + '</td>' +
                    '<td>' +
                    (item.status === '已填报' ? '<button class="btn btn-primary" onclick="viewReport(' + item.id + ')" style="padding: 4px 10px; font-size: 12px;">查看</button>' : '') +
                    '<button class="btn btn-warning" onclick="editReport(' + item.id + ')" style="padding: 4px 10px; font-size: 12px; margin-left: 5px;">' + (item.status === '已填报' ? '修改' : '填报') + '</button>' +
                    '</td>' +
                    '</tr>';
                tbody.innerHTML += row;
            });
        }

        function searchData() {
            var year = document.getElementById('taskYear').value;
            var dept = document.getElementById('deptName').value;
            var status = document.getElementById('reportStatus').value;

            var filtered = reportData.filter(function(item) {
                var match = true;
                if (year && item.taskYear !== year) match = false;
                if (dept && item.deptName !== dept) match = false;
                if (status && item.status !== status) match = false;
                return match;
            });
            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById('taskYear').value = '';
            document.getElementById('deptName').value = '';
            document.getElementById('reportStatus').value = '';
            renderTable(reportData);
        }

        function updateStats() {
            var totalPlan = 0;
            var totalActual = 0;
            var reportCount = 0;

            reportData.forEach(function(item) {
                totalPlan += item.planCount;
                totalActual += item.actualCount;
                if (item.status === '已填报') {
                    reportCount++;
                }
            });

            var completionRate = totalPlan > 0 ? Math.round((totalActual / totalPlan) * 100) : 0;

            document.getElementById('totalPlan').innerText = totalPlan.toLocaleString();
            document.getElementById('totalActual').innerText = totalActual.toLocaleString();
            document.getElementById('completionRate').innerText = completionRate + '%';
            document.getElementById('reportCount').innerText = reportCount;
        }

        function fillReport() {
            document.getElementById('modalId').value = '';
            document.getElementById('fillYear').value = '2026';
            document.getElementById('fillDept').value = '';
            document.getElementById('planCount').value = '';
            document.getElementById('actualCount').value = '';
            document.getElementById('fillPerson').value = '';
            document.getElementById('fillRemark').value = '';
            document.getElementById('fillModal').classList.add('show');
        }

        function editReport(id) {
            var item = reportData.find(function(i) { return i.id === id; });
            if (item) {
                document.getElementById('modalId').value = item.id;
                document.getElementById('fillYear').value = item.taskYear;
                document.getElementById('fillDept').value = item.deptName;
                document.getElementById('planCount').value = item.planCount || '';
                document.getElementById('actualCount').value = item.actualCount || '';
                document.getElementById('fillPerson').value = item.fillPerson || '';
                document.getElementById('fillRemark').value = '';
                document.getElementById('fillModal').classList.add('show');
            }
        }

        function closeFillModal() {
            document.getElementById('fillModal').classList.remove('show');
        }

        function saveReport() {
            var id = document.getElementById('modalId').value;
            var year = document.getElementById('fillYear').value;
            var dept = document.getElementById('fillDept').value;
            var planCount = parseInt(document.getElementById('planCount').value) || 0;
            var actualCount = parseInt(document.getElementById('actualCount').value) || 0;
            var fillPerson = document.getElementById('fillPerson').value;

            if (!dept) {
                alert('请选择填报部门');
                return;
            }
            if (!fillPerson) {
                alert('请输入填报人');
                return;
            }

            if (id) {
                var item = reportData.find(function(i) { return i.id === parseInt(id); });
                if (item) {
                    item.planCount = planCount;
                    item.actualCount = actualCount;
                    item.fillPerson = fillPerson;
                    item.fillTime = new Date().toLocaleString();
                }
            } else {
                var newItem = {
                    id: Date.now(),
                    batchNo: 'BS' + year + String(reportData.length + 1).padStart(3, '0'),
                    deptName: dept,
                    taskYear: year,
                    planCount: planCount,
                    actualCount: actualCount,
                    status: '已填报',
                    fillPerson: fillPerson,
                    fillTime: new Date().toLocaleString()
                };
                reportData.push(newItem);
            }

            alert('提交成功');
            closeFillModal();
            renderTable(reportData);
            updateStats();
        }

        function viewReport(id) {
            var item = reportData.find(function(i) { return i.id === id; });
            if (item) {
                var rate = item.planCount > 0 ? Math.round((item.actualCount / item.planCount) * 100) : 0;
                alert('报送详情:\n批次号: ' + item.batchNo + '\n部门: ' + item.deptName + '\n年度: ' + item.taskYear + '年\n计划数: ' + item.planCount + '\n实际完成数: ' + item.actualCount + '\n完成率: ' + rate + '%\n填报人: ' + item.fillPerson + '\n填报时间: ' + item.fillTime);
            }
        }

        function exportData() {
            alert('导出功能开发中');
        }

        init();
    </script>
</body>
</html>
