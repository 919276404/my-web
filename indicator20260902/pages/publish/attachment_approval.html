<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>附件审批流转管理</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .filter-section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-item label {
            font-weight: 500;
            min-width: 100px;
        }
        .filter-item input, .filter-item select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #1890ff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #40a9ff;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-left: 10px;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-success {
            background: #52c41a;
            color: #fff;
        }
        .btn-success:hover {
            background: #73d13d;
        }
        .btn-warning {
            background: #faad14;
            color: #fff;
        }
        .btn-warning:hover {
            background: #ffc53d;
        }
        .btn-danger {
            background: #ff4d4f;
            color: #fff;
        }
        .btn-danger:hover {
            background: #ff7875;
        }
        .table-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .table-scroll {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 500px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-pending {
            background: #fff7e6;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }
        .status-approved {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .status-rejected {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        .status-processing {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 0 0 auto;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }
        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #666;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1 1 auto;
        }
        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex: 0 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .info-label {
            font-weight: 500;
            color: #666;
            width: 30%;
        }
        .info-value {
            color: #333;
            width: 70%;
        }
        .approval-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            margin-bottom: 20px;
        }
        .approval-tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.3s;
        }
        .approval-tab.active {
            border-bottom-color: #1890ff;
            color: #1890ff;
            font-weight: 600;
        }
        .approval-tab:hover {
            color: #1890ff;
        }
        .approval-panel {
            display: none;
        }
        .approval-panel.active {
            display: block;
        }
        .recheck-info {
            background: #fff7e6;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            border-left: 4px solid #faad14;
        }
        .recheck-title {
            font-weight: 600;
            margin-bottom: 10px;
        }
        .template-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .template-item {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .template-item:hover {
            background: #e0e0e0;
        }
        .approval-history {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .history-title {
            font-weight: 600;
            margin-bottom: 15px;
        }
        .history-item {
            padding: 12px;
            border-bottom: 1px dashed #eee;
        }
        .history-item:last-child {
            border-bottom: none;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .history-approver {
            font-weight: 600;
        }
        .history-time {
            color: #999;
            font-size: 12px;
        }
        .history-comment {
            color: #666;
            font-size: 13px;
        }
        .sub-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .sub-table th, .sub-table td {
            padding: 8px;
            border: 1px solid #eee;
            font-size: 13px;
        }
        .sub-table th {
            background: #fafafa;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="filter-section">
        <div class="filter-row">
            <div class="filter-item">
                <label>审批状态：</label>
                <select id="approvalStatus">
                    <option value="">全部</option>
                    <option value="待审批">待审批</option>
                    <option value="审批中">审批中</option>
                    <option value="已通过">已通过</option>
                    <option value="已驳回">已驳回</option>
                </select>
            </div>
            <div class="filter-item">
                <label>附件类型：</label>
                <select id="attachmentType">
                    <option value="">全部</option>
                    <option value="合格样品信息表">合格样品信息表</option>
                    <option value="不合格样品信息表">不合格样品信息表</option>
                    <option value="信用归集表">信用归集表</option>
                    <option value="信息核对表">信息核对表</option>
                </select>
            </div>
            <div class="filter-item">
                <label>提交时间：</label>
                <input type="date" id="startDate">
                <span>至</span>
                <input type="date" id="endDate">
            </div>
        </div>
        <div class="filter-row">
            <button class="btn btn-primary" onclick="searchData()">查询</button>
            <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h3>待审批附件列表</h3>
            <div>
                <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
            </div>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>附件编号</th>
                        <th>附件类型</th>
                        <th>公示编号</th>
                        <th>涉及样品数</th>
                        <th>提交人</th>
                        <th>提交时间</th>
                        <th>当前审批环节</th>
                        <th>审批状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="approvalTable">
                </tbody>
            </table>
        </div>
    </div>

    <div id="approvalModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="approvalModalTitle">附件审批</div>
                <div class="modal-close" onclick="closeApprovalModal()">×</div>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalId" value="">
                <div class="info-row">
                    <span class="info-label">附件编号：</span>
                    <span class="info-value" id="modalAttachNo"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">附件类型：</span>
                    <span class="info-value" id="modalAttachType"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">公示编号：</span>
                    <span class="info-value" id="modalPublishNo"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">提交人：</span>
                    <span class="info-value" id="modalSubmitter"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">提交时间：</span>
                    <span class="info-value" id="modalSubmitTime"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">当前审批环节：</span>
                    <span class="info-value" id="modalCurrentStep"></span>
                </div>

                <div class="approval-tabs">
                    <div class="approval-tab active" onclick="switchTab('detail')">附件详情</div>
                    <div class="approval-tab" onclick="switchTab('recheck')">复检情况</div>
                    <div class="approval-tab" onclick="switchTab('history')">审批历史</div>
                </div>

                <div class="approval-panel active" id="tab-detail">
                    <h4 style="margin-bottom: 15px;">不合格样品信息</h4>
                    <div class="table-scroll" style="max-height: 200px;">
                        <table class="sub-table">
                            <thead>
                                <tr>
                                    <th>抽样编号</th>
                                    <th>食品名称</th>
                                    <th>企业名称</th>
                                    <th>不合格项目</th>
                                    <th>检测值</th>
                                    <th>限值</th>
                                </tr>
                            </thead>
                            <tbody id="detailTable">
                            </tbody>
                        </table>
                    </div>
                    <div class="form-group" style="margin-top: 20px;">
                        <label>补充修改内容</label>
                        <textarea id="modifyContent" placeholder="如需对附件内容进行补充修改，请在此填写"></textarea>
                    </div>
                </div>

                <div class="approval-panel" id="tab-recheck">
                    <div id="recheckContent"></div>
                </div>

                <div class="approval-panel" id="tab-history">
                    <div id="historyContent"></div>
                </div>

                <div class="approval-history" id="modalHistory">
                </div>

                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;">
                    <h4>审批意见</h4>
                    <div class="template-list">
                        <div class="template-item" onclick="applyTemplate('同意')">同意</div>
                        <div class="template-item" onclick="applyTemplate('不同意，请补充材料')">不同意，请补充材料</div>
                        <div class="template-item" onclick="applyTemplate('需进一步核实')">需进一步核实</div>
                        <div class="template-item" onclick="applyTemplate('同意发布')">同意发布</div>
                    </div>
                    <div class="form-group">
                        <textarea id="approvalComment" placeholder="请输入审批意见"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeApprovalModal()">取消</button>
                <button class="btn btn-warning" onclick="rejectApproval()">驳回</button>
                <button class="btn btn-success" onclick="approve()">通过</button>
            </div>
        </div>
    </div>

    <script>

                ]

        function init() {
            renderTable(approvalData);
        }

        function renderTable(data) {
            var tbody = document.getElementById('approvalTable');
            tbody.innerHTML = '';
            data.forEach(function(item, index) {
                var statusClass = '';
                if (item.status === '待审批') statusClass = 'status-pending';
                else if (item.status === '审批中') statusClass = 'status-processing';
                else if (item.status === '已通过') statusClass = 'status-approved';
                else if (item.status === '已驳回') statusClass = 'status-rejected';

                var row = '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + item.attachNo + '</td>' +
                    '<td>' + item.attachType + '</td>' +
                    '<td>' + item.publishNo + '</td>' +
                    '<td>' + item.sampleCount + '</td>' +
                    '<td>' + item.submitter + '</td>' +
                    '<td>' + item.submitTime + '</td>' +
                    '<td>' + item.currentStep + '</td>' +
                    '<td><span class="status-tag ' + statusClass + '">' + item.status + '</span></td>' +
                    '<td>' +
                    '<button class="btn btn-primary" onclick="viewApproval(' + item.id + ')" style="padding: 4px 10px; font-size: 12px;">查看详情</button>' +
                    ((item.status === '待审批' || item.status === '审批中') ? '<button class="btn btn-success" onclick="openApproval(' + item.id + ')" style="padding: 4px 10px; font-size: 12px; margin-left: 5px;">审批</button>' : '') +
                    '</td>' +
                    '</tr>';
                tbody.innerHTML += row;
            });
        }

        function searchData() {
            var status = document.getElementById('approvalStatus').value;
            var type = document.getElementById('attachmentType').value;
            var startDate = document.getElementById('startDate').value;
            var endDate = document.getElementById('endDate').value;

            var filtered = approvalData.filter(function(item) {
                var match = true;
                if (status && item.status !== status) match = false;
                if (type && item.attachType !== type) match = false;
                if (startDate && item.submitTime.split(' ')[0] < startDate) match = false;
                if (endDate && item.submitTime.split(' ')[0] > endDate) match = false;
                return match;
            });
            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById('approvalStatus').value = '';
            document.getElementById('attachmentType').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            renderTable(approvalData);
        }

        function viewApproval(id) {
            var item = approvalData.find(function(i) { return i.id === id; });
            if (item) {
                openModal(item);
            }
        }

        function openApproval(id) {
            var item = approvalData.find(function(i) { return i.id === id; });
            if (item) {
                openModal(item);
            }
        }

        function openModal(item) {
            document.getElementById('modalId').value = item.id;
            document.getElementById('modalAttachNo').innerText = item.attachNo;
            document.getElementById('modalAttachType').innerText = item.attachType;
            document.getElementById('modalPublishNo').innerText = item.publishNo;
            document.getElementById('modalSubmitter').innerText = item.submitter;
            document.getElementById('modalSubmitTime').innerText = item.submitTime;
            document.getElementById('modalCurrentStep').innerText = item.currentStep;
            document.getElementById('modifyContent').value = '';
            document.getElementById('approvalComment').value = '';

            var detailHtml = '';
            if (item.samples && item.samples.length > 0) {
                item.samples.forEach(function(sample) {
                    detailHtml += '<tr>' +
                        '<td>' + sample.sampleNo + '</td>' +
                        '<td>' + sample.foodName + '</td>' +
                        '<td>' + sample.companyName + '</td>' +
                        '<td>' + sample.unqualifiedItem + '</td>' +
                        '<td>' + sample.testValue + '</td>' +
                        '<td>' + sample.limit + '</td>' +
                        '</tr>';
                });
            } else {
                detailHtml = '<tr><td colspan="6" style="text-align: center;">暂无数据</td></tr>';
            }
            document.getElementById('detailTable').innerHTML = detailHtml;

            var recheckHtml = '';
            if (item.samples && item.samples.length > 0) {
                var recheckSamples = item.samples.filter(function(s) { return s.hasRecheck; });
                if (recheckSamples.length > 0) {
                    recheckHtml = '<div class="recheck-info"><div class="recheck-title">复检样品清单</div>';
                    recheckSamples.forEach(function(sample) {
                        recheckHtml += '<p><strong>' + sample.sampleNo + ' - ' + sample.foodName + '</strong></p>' +
                            '<p>复检结论：' + sample.recheckResult + ' | 复检时间：' + sample.recheckTime + '</p>';
                    });
                    recheckHtml += '</div>';
                } else {
                    recheckHtml = '<p style="color: #999;">暂无复检样品</p>';
                }
            }
            document.getElementById('recheckContent').innerHTML = recheckHtml;

            var historyHtml = '';
            if (item.history && item.history.length > 0) {
                item.history.forEach(function(h) {
                    historyHtml += '<div class="history-item">' +
                        '<div class="history-header">' +
                        '<span class="history-approver">' + h.approver + ' (' + h.step + ')</span>' +
                        '<span class="history-time">' + h.time + '</span>' +
                        '</div>' +
                        '<div class="history-comment">' + h.comment + '</div>' +
                        '</div>';
                });
            } else {
                historyHtml = '<p style="color: #999;">暂无审批历史</p>';
            }
            document.getElementById('historyContent').innerHTML = historyHtml;

            switchTab('detail');
            document.getElementById('approvalModal').classList.add('show');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.approval-tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.approval-panel').forEach(function(p) { p.classList.remove('active'); });
            document.querySelector('.approval-tab[onclick="switchTab(\'' + tabName + '\')"]').classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function applyTemplate(text) {
            document.getElementById('approvalComment').value = text;
        }

        function closeApprovalModal() {
            document.getElementById('approvalModal').classList.remove('show');
        }

        function approve() {
            var id = parseInt(document.getElementById('modalId').value);
            var comment = document.getElementById('approvalComment').value;
            var modifyContent = document.getElementById('modifyContent').value;

            if (!comment) {
                alert('请输入审批意见');
                return;
            }

            var item = approvalData.find(function(i) { return i.id === id; });
            if (item) {
                item.status = '已通过';
                item.history.push({
                    approver: '当前用户',
                    step: item.currentStep,
                    comment: comment,
                    time: new Date().toLocaleString(),
                    result: '通过'
                });
                if (modifyContent) {
                    item.history[item.history.length - 1].modifyContent = modifyContent;
                }
            }

            alert('审批通过');
            closeApprovalModal();
            renderTable(approvalData);
        }

        function rejectApproval() {
            var id = parseInt(document.getElementById('modalId').value);
            var comment = document.getElementById('approvalComment').value;

            if (!comment) {
                alert('请输入审批意见');
                return;
            }

            var item = approvalData.find(function(i) { return i.id === id; });
            if (item) {
                item.status = '已驳回';
                item.history.push({
                    approver: '当前用户',
                    step: item.currentStep,
                    comment: comment,
                    time: new Date().toLocaleString(),
                    result: '驳回'
                });
            }

            alert('已驳回');
            closeApprovalModal();
            renderTable(approvalData);
        }

        function exportData() {
            alert('导出功能开发中');
        }

        init();
    </script>
</body>
</html>
