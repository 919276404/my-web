<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>半年度工作总结填报</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .filter-section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-item label {
            font-weight: 500;
            min-width: 100px;
        }
        .filter-item input, .filter-item select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #1890ff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #40a9ff;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-left: 10px;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-success {
            background: #52c41a;
            color: #fff;
        }
        .btn-success:hover {
            background: #73d13d;
        }
        .table-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .table-scroll {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 500px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-pending {
            background: #fff7e6;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }
        .status-completed {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 0 0 auto;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }
        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #666;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1 1 auto;
        }
        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex: 0 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
            min-height: 150px;
            font-family: inherit;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .content-section {
            background: #fafafa;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .content-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #1890ff;
        }
        .content-text {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="filter-section">
        <div class="filter-row">
            <div class="filter-item">
                <label>任务年度：</label>
                <select id="taskYear">
                    <option value="">全部</option>
                    <option value="2026">2026年</option>
                    <option value="2025">2025年</option>
                </select>
            </div>
            <div class="filter-item">
                <label>填报部门：</label>
                <select id="deptName">
                    <option value="">全部</option>
                    <option value="东城区市场监管局">东城区市场监管局</option>
                    <option value="西城区市场监管局">西城区市场监管局</option>
                    <option value="朝阳区市场监管局">朝阳区市场监管局</option>
                    <option value="海淀区市场监管局">海淀区市场监管局</option>
                </select>
            </div>
            <div class="filter-item">
                <label>填报状态：</label>
                <select id="reportStatus">
                    <option value="">全部</option>
                    <option value="未填报">未填报</option>
                    <option value="已填报">已填报</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="searchData()">查询</button>
            <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h3>半年度工作总结填报列表</h3>
            <div>
                <button class="btn btn-success" onclick="fillReport()">填报工作总结</button>
                <button class="btn btn-secondary" onclick="exportData()" style="margin-left: 10px;">导出数据</button>
            </div>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>报送批次号</th>
                        <th>填报部门</th>
                        <th>任务年度</th>
                        <th>工作阶段</th>
                        <th>填报状态</th>
                        <th>提交人</th>
                        <th>提交时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="reportTable">
                </tbody>
            </table>
        </div>
    </div>

    <div id="fillModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">半年度工作总结填报</div>
                <div class="modal-close" onclick="closeFillModal()">×</div>
            </div>
            <div class="modal-body">
                <input type="hidden" id="modalId" value="">
                <div class="form-row">
                    <div class="form-group">
                        <label>任务年度</label>
                        <select id="fillYear">
                            <option value="2026">2026年</option>
                            <option value="2025">2025年</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>工作阶段</label>
                        <select id="workStage">
                            <option value="上半年">上半年</option>
                            <option value="下半年">下半年</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>填报部门</label>
                    <select id="fillDept">
                        <option value="东城区市场监管局">东城区市场监管局</option>
                        <option value="西城区市场监管局">西城区市场监管局</option>
                        <option value="朝阳区市场监管局">朝阳区市场监管局</option>
                        <option value="海淀区市场监管局">海淀区市场监管局</option>
                        <option value="丰台区市场监管局">丰台区市场监管局</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>工作成效</label>
                    <textarea id="workAchievement" placeholder="请详细描述本阶段的工作成效，包括抽检任务完成情况、风险发现情况、专项整治成果等"></textarea>
                </div>
                <div class="form-group">
                    <label>遇到问题</label>
                    <textarea id="workProblems" placeholder="请详细描述工作中遇到的问题和困难，包括技术难题、资源不足、协调困难等"></textarea>
                </div>
                <div class="form-group">
                    <label>典型经验</label>
                    <textarea id="workExperience" placeholder="请总结工作中的典型经验和做法，包括创新举措、成功案例、工作亮点等"></textarea>
                </div>
                <div class="form-group">
                    <label>提交人</label>
                    <input type="text" id="fillPerson" placeholder="请输入提交人姓名">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeFillModal()">取消</button>
                <button class="btn btn-primary" onclick="saveReport()">提交</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">工作总结详情</div>
                <div class="modal-close" onclick="closeDetailModal()">×</div>
            </div>
            <div class="modal-body" id="detailContent">
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        var reportData = [
            { id: 1, batchNo: 'BG2026001', deptName: '东城区市场监管局', taskYear: '2026', workStage: '上半年', status: '已填报', fillPerson: '张三', fillTime: '2026-07-15 10:30', achievement: '上半年完成抽检任务800批次，发现不合格样品32批次，合格率96%。开展专项整治行动5次，查处违法案件28起。', problems: '部分食品生产企业配合度不高，抽检样品采集难度较大。检验机构检测周期较长，影响报告出具效率。', experience: '建立企业信用评价机制，对配合度高的企业减少抽检频次，对问题企业增加抽检力度。与检验机构建立沟通协调机制，优化检测流程。' },
            { id: 2, batchNo: 'BG2026002', deptName: '西城区市场监管局', taskYear: '2026', workStage: '上半年', status: '已填报', fillPerson: '李四', fillTime: '2026-07-16 14:20', achievement: '上半年完成抽检任务650批次，发现不合格样品25批次，合格率96.2%。组织培训活动3次，培训监管人员200余人次。', problems: '监管人员数量不足，日常监管与抽检任务冲突。部分抽检项目检测费用较高，经费压力较大。', experience: '推行网格化监管模式，合理分配监管力量。优化抽检项目组合，优先选择高风险、低成本检测项目。' },
            { id: 3, batchNo: '', deptName: '朝阳区市场监管局', taskYear: '2026', workStage: '上半年', status: '未填报', fillPerson: '', fillTime: '', achievement: '', problems: '', experience: '' },
            { id: 4, batchNo: '', deptName: '海淀区市场监管局', taskYear: '2026', workStage: '上半年', status: '未填报', fillPerson: '', fillTime: '', achievement: '', problems: '', experience: '' },
            { id: 5, batchNo: 'BG2025001', deptName: '东城区市场监管局', taskYear: '2025', workStage: '上半年', status: '已填报', fillPerson: '张三', fillTime: '2025-07-18 11:00', achievement: '上半年完成抽检任务750批次，发现不合格样品28批次，合格率96.3%。', problems: '部分大型超市抽检协调难度较大。', experience: '与大型超市建立合作机制，提前沟通抽检计划。' }
        ];

        function init() {
            renderTable(reportData);
        }

        function renderTable(data) {
            var tbody = document.getElementById('reportTable');
            tbody.innerHTML = '';
            data.forEach(function(item, index) {
                var statusClass = item.status === '已填报' ? 'status-completed' : 'status-pending';

                var row = '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + (item.batchNo || '-') + '</td>' +
                    '<td>' + item.deptName + '</td>' +
                    '<td>' + item.taskYear + '年</td>' +
                    '<td>' + item.workStage + '</td>' +
                    '<td><span class="status-tag ' + statusClass + '">' + item.status + '</span></td>' +
                    '<td>' + (item.fillPerson || '-') + '</td>' +
                    '<td>' + (item.fillTime || '-') + '</td>' +
                    '<td>' +
                    (item.status === '已填报' ? '<button class="btn btn-primary" onclick="viewReport(' + item.id + ')" style="padding: 4px 10px; font-size: 12px;">查看详情</button>' : '') +
                    '<button class="btn btn-warning" onclick="editReport(' + item.id + ')" style="padding: 4px 10px; font-size: 12px; margin-left: 5px;">' + (item.status === '已填报' ? '修改' : '填报') + '</button>' +
                    '</td>' +
                    '</tr>';
                tbody.innerHTML += row;
            });
        }

        function searchData() {
            var year = document.getElementById('taskYear').value;
            var dept = document.getElementById('deptName').value;
            var status = document.getElementById('reportStatus').value;

            var filtered = reportData.filter(function(item) {
                var match = true;
                if (year && item.taskYear !== year) match = false;
                if (dept && item.deptName !== dept) match = false;
                if (status && item.status !== status) match = false;
                return match;
            });
            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById('taskYear').value = '';
            document.getElementById('deptName').value = '';
            document.getElementById('reportStatus').value = '';
            renderTable(reportData);
        }

        function fillReport() {
            document.getElementById('modalId').value = '';
            document.getElementById('fillYear').value = '2026';
            document.getElementById('workStage').value = '上半年';
            document.getElementById('fillDept').value = '';
            document.getElementById('workAchievement').value = '';
            document.getElementById('workProblems').value = '';
            document.getElementById('workExperience').value = '';
            document.getElementById('fillPerson').value = '';
            document.getElementById('fillModal').classList.add('show');
        }

        function editReport(id) {
            var item = reportData.find(function(i) { return i.id === id; });
            if (item) {
                document.getElementById('modalId').value = item.id;
                document.getElementById('fillYear').value = item.taskYear;
                document.getElementById('workStage').value = item.workStage;
                document.getElementById('fillDept').value = item.deptName;
                document.getElementById('workAchievement').value = item.achievement;
                document.getElementById('workProblems').value = item.problems;
                document.getElementById('workExperience').value = item.experience;
                document.getElementById('fillPerson').value = item.fillPerson;
                document.getElementById('fillModal').classList.add('show');
            }
        }

        function closeFillModal() {
            document.getElementById('fillModal').classList.remove('show');
        }

        function saveReport() {
            var id = document.getElementById('modalId').value;
            var year = document.getElementById('fillYear').value;
            var stage = document.getElementById('workStage').value;
            var dept = document.getElementById('fillDept').value;
            var achievement = document.getElementById('workAchievement').value;
            var problems = document.getElementById('workProblems').value;
            var experience = document.getElementById('workExperience').value;
            var fillPerson = document.getElementById('fillPerson').value;

            if (!dept) {
                alert('请选择填报部门');
                return;
            }
            if (!fillPerson) {
                alert('请输入提交人');
                return;
            }
            if (!achievement) {
                alert('请填写工作成效');
                return;
            }

            if (id) {
                var item = reportData.find(function(i) { return i.id === parseInt(id); });
                if (item) {
                    item.achievement = achievement;
                    item.problems = problems;
                    item.experience = experience;
                    item.fillPerson = fillPerson;
                    item.fillTime = new Date().toLocaleString();
                }
            } else {
                var newItem = {
                    id: Date.now(),
                    batchNo: 'BG' + year + String(reportData.length + 1).padStart(3, '0'),
                    deptName: dept,
                    taskYear: year,
                    workStage: stage,
                    status: '已填报',
                    fillPerson: fillPerson,
                    fillTime: new Date().toLocaleString(),
                    achievement: achievement,
                    problems: problems,
                    experience: experience
                };
                reportData.push(newItem);
            }

            alert('提交成功');
            closeFillModal();
            renderTable(reportData);
        }

        function viewReport(id) {
            var item = reportData.find(function(i) { return i.id === id; });
            if (item) {
                var html = '<div class="content-section">' +
                    '<div class="content-title">工作成效</div>' +
                    '<div class="content-text">' + item.achievement + '</div>' +
                    '</div>' +
                    '<div class="content-section">' +
                    '<div class="content-title">遇到问题</div>' +
                    '<div class="content-text">' + (item.problems || '无') + '</div>' +
                    '</div>' +
                    '<div class="content-section">' +
                    '<div class="content-title">典型经验</div>' +
                    '<div class="content-text">' + (item.experience || '无') + '</div>' +
                    '</div>';
                document.getElementById('detailContent').innerHTML = html;
                document.getElementById('detailModal').classList.add('show');
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function exportData() {
            alert('导出功能开发中');
        }

        init();
    </script>
</body>
</html>
