        function renderTab1Table(data) {
            var tbody = document.getElementById('tab1TableBody');
            tbody.innerHTML = data.map(function(item, index) {
                var levelBadge = item.level === '一级提醒' ? 'badge-level1' : 'badge-level2';
                var statusBadge = item.feedbackStatus === '已处理' ? 'badge-success' : 'badge-warning';
                var hasPlanDoc = item.planDocs && item.planDocs.length > 0;
                
                return '<tr>' +
                    '<td><input type="checkbox"></td>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + item.alertNo + '</td>' +
                    '<td>' + item.ruleName + '</td>' +
                    '<td><span class="badge ' + levelBadge + '">' + item.level + '</span></td>' +
                    '<td>' + item.summary + '</td>' +
                    '<td>' + item.target + '</td>' +
                    '<td>' + item.receiveTime + '</td>' +
                    '<td><span class="badge ' + statusBadge + '">' + item.feedbackStatus + '</span></td>' +
                    '<td>' + item.planStatus + '</td>' +
                    '<td>' +
                        '<button class="action-btn action-btn-view" onclick="openAlertDetail(' + item.id + ')">查看详情</button>' +
                        (hasPlanDoc ? '<button class="action-btn action-btn-plan" onclick="openPlanDoc(' + item.id + ')">查看计划文档</button>' : '') +
                    '</td>' +
                    '</tr>';
            }).join('');
        }

        function renderTab2Table(data) {
            var tbody = document.getElementById('tab2TableBody');
            tbody.innerHTML = data.map(function(item, index) {
                var resultBadge = item.result === '执行成功' ? 'badge-success' : 
                                 (item.result === '部分成功' ? 'badge-warning' : 'badge-failed');
                
                return '<tr>' +
                    '<td><input type="checkbox"></td>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + item.ruleName + '</td>' +
                    '<td>' + item.execTime + '</td>' +
                    '<td>' + item.dataCount + '</td>' +
                    '<td>' + item.alertCount + '</td>' +
                    '<td><span class="badge ' + resultBadge + '">' + item.result + '</span></td>' +
                    '<td>' + item.errorInfo + '</td>' +
                    '<td><button class="action-btn action-btn-view" onclick="openLogDetail(' + item.id + ')">查看详情</button></td>' +
                    '</tr>';
            }).join('');

        function switchTab(tabId) {
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelector('.tab-item[onclick="switchTab(\'' + tabId + '\')"]').classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

                    detailHtml += '<div class="detail-section">' +

                        '<div class="detail-info">';

                        detailHtml += '<div class="detail-item"><div class="detail-label">' + rec.type + '</div><div class="detail-value">' + rec.count + '条 - ' + rec.desc + '</div></div>';

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('active');

        function openPlanDoc(id) {
            var item = alertData.find(function(d) { return d.id === id; });
            if (!item || !item.planDocs || item.planDocs.length === 0) return;

            var planHtml = '<div class="detail-section">' +
                '<div class="detail-title">关联计划文档</div>' +
                '<div class="plan-doc-list">';
            
            item.planDocs.forEach(function(doc) {
                var icon = doc.type === 'pdf' ? '📕' : (doc.type === 'doc' ? '📘' : '📄');
                planHtml += '<div class="plan-doc-item">' +
                    '<div class="plan-doc-icon">' + icon + '</div>' +
                    '<div class="plan-doc-info">' +
                        '<div class="plan-doc-name">' + doc.name + '</div>' +
                        '<div class="plan-doc-date">' + doc.date + ' | ' + doc.size + '</div>' +
                    '</div>' +
                    '<button class="plan-doc-action" onclick="downloadDoc(\'' + doc.name + '\')">下载</button>' +
                    '</div>';
            });
            
            planHtml += '</div></div>';
            
            document.getElementById('planContent').innerHTML = planHtml;
            document.getElementById('planModal').classList.add('active');
        }

        function closePlanModal() {
            document.getElementById('planModal').classList.remove('active');
        }

        function downloadDoc(docName) {
            alert('正在下载文档：' + docName);
        }

        function clearTab1Search() {
            document.getElementById('tab1SearchRule').value = '';
            document.getElementById('tab1SearchLevel').value = '请选择';
            document.getElementById('tab1SearchStatus').value = '请选择';
            document.getElementById('tab1StartDate').value = '';
            document.getElementById('tab1EndDate').value = '';
            renderTab1Table(alertData);
        }

        function doTab1Search() {
            var ruleName = document.getElementById('tab1SearchRule').value.trim().toLowerCase();
            var level = document.getElementById('tab1SearchLevel').value;
            var status = document.getElementById('tab1SearchStatus').value;
            
            var filtered = alertData.filter(function(item) {
                var matchName = !ruleName || item.ruleName.toLowerCase().includes(ruleName);
                var matchLevel = level === '请选择' || item.level === level;
                var matchStatus = status === '请选择' || item.feedbackStatus === status;
                return matchName && matchLevel && matchStatus;
            });
            
            renderTab1Table(filtered);
        }

        function clearTab2Search() {
            document.getElementById('tab2SearchRule').value = '';
            document.getElementById('tab2StartDate').value = '';
            document.getElementById('tab2EndDate').value = '';
            renderTab2Table(logData);
        }

        function doTab2Search() {
            var ruleName = document.getElementById('tab2SearchRule').value.trim().toLowerCase();
            
            var filtered = logData.filter(function(item) {
                var matchName = !ruleName || item.ruleName.toLowerCase().includes(ruleName);
                return matchName;
            });
            
            renderTab2Table(filtered);
        }

        renderTab1Table(alertData);
        renderTab2Table(logData);
    </script>
