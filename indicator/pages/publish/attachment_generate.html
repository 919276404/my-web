<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>附件自动生成</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .filter-section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-item label {
            font-weight: 500;
            min-width: 100px;
        }
        .filter-item input, .filter-item select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #1890ff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #40a9ff;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-left: 10px;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-success {
            background: #52c41a;
            color: #fff;
        }
        .btn-success:hover {
            background: #73d13d;
        }
        .btn-warning {
            background: #faad14;
            color: #fff;
        }
        .btn-warning:hover {
            background: #ffc53d;
        }
        .btn-danger {
            background: #ff4d4f;
            color: #fff;
        }
        .btn-danger:hover {
            background: #ff7875;
        }
        .table-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .table-scroll {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 500px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-pass {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .status-fail {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        .attachment-section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .attachment-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .attachment-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .attachment-card:hover {
            border-color: #1890ff;
            box-shadow: 0 4px 12px rgba(24,144,255,0.15);
        }
        .attachment-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .attachment-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .attachment-desc {
            font-size: 12px;
            color: #999;
            margin-bottom: 15px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 1000px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 0 0 auto;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }
        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #666;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1 1 auto;
        }
        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex: 0 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .info-label {
            font-weight: 500;
            color: #666;
            width: 30%;
        }
        .info-value {
            color: #333;
            width: 70%;
        }
        .process-detail {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .process-title {
            font-weight: 600;
            margin-bottom: 15px;
        }
        .process-list {
            list-style: none;
            padding: 0;
        }
        .process-item {
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
            display: flex;
            justify-content: space-between;
        }
        .process-item:last-child {
            border-bottom: none;
        }
        .process-name {
            font-weight: 500;
        }
        .process-result {
            color: #666;
            font-size: 13px;
        }
        .generate-progress {
            width: 100%;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-bar {
            height: 100%;
            background: #1890ff;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="filter-section">
        <div class="filter-row">
            <div class="filter-item">
                <label>抽样时间范围：</label>
                <input type="date" id="startDate">
                <span>至</span>
                <input type="date" id="endDate">
            </div>
            <div class="filter-item">
                <label>食品大类：</label>
                <select id="foodCategory">
                    <option value="">全部</option>
                    <option value="粮食加工品">粮食加工品</option>
                    <option value="食用油、油脂及其制品">食用油、油脂及其制品</option>
                    <option value="调味品">调味品</option>
                    <option value="肉制品">肉制品</option>
                    <option value="乳制品">乳制品</option>
                    <option value="饮料">饮料</option>
                </select>
            </div>
            <div class="filter-item">
                <label>判定结论：</label>
                <select id="judgment">
                    <option value="">全部</option>
                    <option value="合格">合格</option>
                    <option value="不合格">不合格</option>
                </select>
            </div>
        </div>
        <div class="filter-row">
            <button class="btn btn-primary" onclick="searchData()">查询</button>
            <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
            <button class="btn btn-success" onclick="generateAllAttachments()">一键生成全部附件</button>
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h3>样品列表</h3>
            <div>
                <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
            </div>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                        <th>序号</th>
                        <th>抽样编号</th>
                        <th>食品名称</th>
                        <th>被抽样单位名称</th>
                        <th>统一社会信用代码</th>
                        <th>不合格项目</th>
                        <th>检测值</th>
                        <th>限值</th>
                        <th>判定结论</th>
                        <th>处置信息</th>
                    </tr>
                </thead>
                <tbody id="sampleTable">
                </tbody>
            </table>
        </div>
    </div>

    <div class="attachment-section">
        <div class="table-header">
            <h3>附件生成</h3>
            <span style="color: #999; font-size: 14px;">根据预设模板自动生成发布所需附件</span>
        </div>
        <div class="attachment-grid">
            <div class="attachment-card" onclick="generateAttachment('qualified')">
                <div class="attachment-icon">✅</div>
                <div class="attachment-name">合格样品信息表</div>
                <div class="attachment-desc">汇总所有合格样品的详细信息</div>
                <button class="btn btn-primary">生成</button>
            </div>
            <div class="attachment-card" onclick="generateAttachment('unqualified')">
                <div class="attachment-icon">❌</div>
                <div class="attachment-name">不合格样品信息表</div>
                <div class="attachment-desc">汇总所有不合格样品的详细信息</div>
                <button class="btn btn-danger">生成</button>
            </div>
            <div class="attachment-card" onclick="generateAttachment('credit')">
                <div class="attachment-icon">📋</div>
                <div class="attachment-name">信用归集表</div>
                <div class="attachment-desc">提取不合格样品企业信用信息</div>
                <button class="btn btn-warning">生成</button>
            </div>
            <div class="attachment-card" onclick="generateAttachment('check')">
                <div class="attachment-icon">🔍</div>
                <div class="attachment-name">信息核对表</div>
                <div class="attachment-desc">按处室、机构和外省分类汇总</div>
                <button class="btn btn-secondary">生成</button>
            </div>
        </div>
    </div>

    <div id="detailModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">样品详情与处置信息</div>
                <div class="modal-close" onclick="closeDetailModal()">×</div>
            </div>
            <div class="modal-body" id="detailContent">
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <div id="generateModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <div class="modal-title" id="generateTitle">生成附件</div>
                <div class="modal-close" onclick="closeGenerateModal()">×</div>
            </div>
            <div class="modal-body">
                <div id="generateInfo"></div>
                <div class="generate-progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div id="generateStatus" style="margin-top: 10px; text-align: center; color: #666;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeGenerateModal()">关闭</button>
                <button class="btn btn-primary" id="downloadBtn" onclick="downloadAttachment()" style="display: none;">下载附件</button>
            </div>
        </div>
    </div>

    <script>
        var sampleData = [
            { id: 1, sampleNo: 'CY2026001', foodName: '小麦粉', companyName: '北京面粉厂', creditCode: '911100001234567890', unqualifiedItem: '', testValue: '0.15', limit: '≤0.5', judgment: '合格', department: '食品生产处', institution: '北京市质检院', isOutProvince: false, processInfo: [{name: '检验完成', result: '合格', date: '2026-01-15'}, {name: '审核通过', result: '无异议', date: '2026-01-18'}] },
            { id: 2, sampleNo: 'CY2026002', foodName: '大豆油', companyName: '北京粮油公司', creditCode: '911100000987654321', unqualifiedItem: '酸价', testValue: '0.8', limit: '≤0.5', judgment: '不合格', department: '食品生产处', institution: '北京市质检院', isOutProvince: false, processInfo: [{name: '检验完成', result: '不合格', date: '2026-01-18'}, {name: '复检申请', result: '受理', date: '2026-01-20'}, {name: '复检完成', result: '维持原结论', date: '2026-01-25'}] },
            { id: 3, sampleNo: 'CY2026003', foodName: '酱油', companyName: '北京调味食品厂', creditCode: '911100001122334455', unqualifiedItem: '', testValue: '合格', limit: '-', judgment: '合格', department: '食品生产处', institution: '北京市质检院', isOutProvince: false, processInfo: [{name: '检验完成', result: '合格', date: '2026-01-22'}] },
            { id: 4, sampleNo: 'CY2026004', foodName: '猪肉香肠', companyName: '北京肉类加工厂', creditCode: '911100006677889900', unqualifiedItem: '亚硝酸盐', testValue: '35mg/kg', limit: '≤30mg/kg', judgment: '不合格', department: '食品流通处', institution: '北京市疾控中心', isOutProvince: false, processInfo: [{name: '检验完成', result: '不合格', date: '2026-01-25'}, {name: '移交监管', result: '已立案', date: '2026-01-28'}] },
            { id: 5, sampleNo: 'CY2026005', foodName: '牛奶', companyName: '河北乳业集团', creditCode: '911300001111222233', unqualifiedItem: '', testValue: '合格', limit: '-', judgment: '合格', department: '食品生产处', institution: '河北省质检院', isOutProvince: true, processInfo: [{name: '检验完成', result: '合格', date: '2026-02-01'}] },
            { id: 6, sampleNo: 'CY2026006', foodName: '瓶装水', companyName: '天津饮品公司', creditCode: '911200004444555566', unqualifiedItem: '菌落总数', testValue: '1000CFU/mL', limit: '≤100CFU/mL', judgment: '不合格', department: '食品流通处', institution: '天津市质检院', isOutProvince: true, processInfo: [{name: '检验完成', result: '不合格', date: '2026-02-05'}, {name: '复检申请', result: '已复检', date: '2026-02-10'}] },
            { id: 7, sampleNo: 'CY2026007', foodName: '方便面', companyName: '北京食品厂', creditCode: '911100007777888899', unqualifiedItem: '过氧化值', testValue: '0.25g/100g', limit: '≤0.20g/100g', judgment: '不合格', department: '食品生产处', institution: '北京市质检院', isOutProvince: false, processInfo: [{name: '检验完成', result: '不合格', date: '2026-02-08'}, {name: '企业召回', result: '已启动', date: '2026-02-12'}] },
            { id: 8, sampleNo: 'CY2026008', foodName: '饼干', companyName: '北京烘焙食品公司', creditCode: '911100000000111122', unqualifiedItem: '', testValue: '合格', limit: '-', judgment: '合格', department: '食品流通处', institution: '北京市疾控中心', isOutProvince: false, processInfo: [{name: '检验完成', result: '合格', date: '2026-02-10'}] },
            { id: 9, sampleNo: 'CY2026009', foodName: '水果罐头', companyName: '北京罐头厂', creditCode: '911100003333444455', unqualifiedItem: '', testValue: '合格', limit: '-', judgment: '合格', department: '食品生产处', institution: '北京市质检院', isOutProvince: false, processInfo: [{name: '检验完成', result: '合格', date: '2026-02-15'}] },
            { id: 10, sampleNo: 'CY2026010', foodName: '冰淇淋', companyName: '北京冷饮公司', creditCode: '911100006666777788', unqualifiedItem: '大肠菌群', testValue: '10MPN/100g', limit: '≤3MPN/100g', judgment: '不合格', department: '食品生产处', institution: '北京市疾控中心', isOutProvince: false, processInfo: [{name: '检验完成', result: '不合格', date: '2026-02-18'}, {name: '责令整改', result: '已整改', date: '2026-02-25'}] }
        ];

        var selectedIds = [];

        function init() {
            renderTable(sampleData);
        }

        function renderTable(data) {
            var tbody = document.getElementById('sampleTable');
            tbody.innerHTML = '';
            data.forEach(function(item, index) {
                var checked = selectedIds.includes(item.id) ? 'checked' : '';
                var row = '<tr>' +
                    '<td><input type="checkbox" ' + checked + ' onclick="toggleSelect(' + item.id + ')"></td>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + item.sampleNo + '</td>' +
                    '<td>' + item.foodName + '</td>' +
                    '<td>' + item.companyName + '</td>' +
                    '<td>' + item.creditCode + '</td>' +
                    '<td>' + (item.unqualifiedItem || '-') + '</td>' +
                    '<td>' + item.testValue + '</td>' +
                    '<td>' + item.limit + '</td>' +
                    '<td><span class="status-tag ' + (item.judgment === '合格' ? 'status-pass' : 'status-fail') + '">' + item.judgment + '</span></td>' +
                    '<td><button class="btn btn-primary" onclick="viewDetail(' + item.id + ')" style="padding: 4px 10px; font-size: 12px;">查看处置信息</button></td>' +
                    '</tr>';
                tbody.innerHTML += row;
            });
        }

        function searchData() {
            var startDate = document.getElementById('startDate').value;
            var endDate = document.getElementById('endDate').value;
            var foodCategory = document.getElementById('foodCategory').value;
            var judgment = document.getElementById('judgment').value;

            var filtered = sampleData.filter(function(item) {
                var match = true;
                if (startDate && item.processInfo[0] && item.processInfo[0].date < startDate) match = false;
                if (endDate && item.processInfo[0] && item.processInfo[0].date > endDate) match = false;
                if (judgment && item.judgment !== judgment) match = false;
                return match;
            });
            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('foodCategory').value = '';
            document.getElementById('judgment').value = '';
            renderTable(sampleData);
        }

        function toggleSelectAll() {
            var checkboxes = document.querySelectorAll('#sampleTable input[type="checkbox"]');
            var allChecked = document.getElementById('selectAll').checked;
            checkboxes.forEach(function(cb) {
                cb.checked = allChecked;
                var row = cb.parentElement.parentElement;
                var sampleNo = row.children[2].innerText;
                var id = parseInt(sampleNo.replace('CY', ''));
                if (allChecked && !selectedIds.includes(id)) {
                    selectedIds.push(id);
                } else if (!allChecked) {
                    selectedIds = selectedIds.filter(function(i) { return i !== id; });
                }
            });
        }

        function toggleSelect(id) {
            var index = selectedIds.indexOf(id);
            if (index > -1) {
                selectedIds.splice(index, 1);
            } else {
                selectedIds.push(id);
            }
        }

        function viewDetail(id) {
            var item = sampleData.find(function(i) { return i.id === id; });
            if (item) {
                var detailHtml = '<div class="info-row"><span class="info-label">抽样编号：</span><span class="info-value">' + item.sampleNo + '</span></div>' +
                    '<div class="info-row"><span class="info-label">食品名称：</span><span class="info-value">' + item.foodName + '</span></div>' +
                    '<div class="info-row"><span class="info-label">被抽样单位名称：</span><span class="info-value">' + item.companyName + '</span></div>' +
                    '<div class="info-row"><span class="info-label">统一社会信用代码：</span><span class="info-value">' + item.creditCode + '</span></div>' +
                    '<div class="info-row"><span class="info-label">不合格项目：</span><span class="info-value">' + (item.unqualifiedItem || '-') + '</span></div>' +
                    '<div class="info-row"><span class="info-label">检测值：</span><span class="info-value">' + item.testValue + '</span></div>' +
                    '<div class="info-row"><span class="info-label">限值：</span><span class="info-value">' + item.limit + '</span></div>' +
                    '<div class="info-row"><span class="info-label">判定结论：</span><span class="info-value">' + item.judgment + '</span></div>' +
                    '<div class="info-row"><span class="info-label">所属处室：</span><span class="info-value">' + item.department + '</span></div>' +
                    '<div class="info-row"><span class="info-label">承检机构：</span><span class="info-value">' + item.institution + '</span></div>' +
                    '<div class="info-row"><span class="info-label">是否外省：</span><span class="info-value">' + (item.isOutProvince ? '是' : '否') + '</span></div>';

                var processHtml = '<div class="process-detail"><div class="process-title">处理和处置详情</div><ul class="process-list">';
                item.processInfo.forEach(function(process) {
                    processHtml += '<li class="process-item"><span class="process-name">' + process.name + '</span><span class="process-result">' + process.result + ' (' + process.date + ')</span></li>';
                });
                processHtml += '</ul></div>';

                document.getElementById('detailContent').innerHTML = detailHtml + processHtml;
                document.getElementById('detailModal').classList.add('show');
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function generateAttachment(type) {
            var titles = {
                'qualified': '合格样品信息表',
                'unqualified': '不合格样品信息表',
                'credit': '信用归集表',
                'check': '信息核对表'
            };

            var filteredData = [];
            if (selectedIds.length > 0) {
                filteredData = sampleData.filter(function(item) { return selectedIds.includes(item.id); });
            } else {
                filteredData = sampleData;
            }

            if (type === 'qualified') {
                filteredData = filteredData.filter(function(item) { return item.judgment === '合格'; });
            } else if (type === 'unqualified') {
                filteredData = filteredData.filter(function(item) { return item.judgment === '不合格'; });
            } else if (type === 'credit') {
                filteredData = filteredData.filter(function(item) { return item.judgment === '不合格'; });
            }

            document.getElementById('generateTitle').innerText = '生成' + titles[type];
            document.getElementById('generateInfo').innerHTML = '<p>正在生成' + titles[type] + '...</p><p>涉及样品数量：' + filteredData.length + '条</p>';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('generateStatus').innerText = '生成中...';
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('generateModal').classList.add('show');

            var progress = 0;
            var interval = setInterval(function() {
                progress += 10;
                document.getElementById('progressBar').style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    document.getElementById('generateStatus').innerText = '生成完成！';
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                }
            }, 200);
        }

        function generateAllAttachments() {
            var qualifiedCount = sampleData.filter(function(item) { return item.judgment === '合格'; }).length;
            var unqualifiedCount = sampleData.filter(function(item) { return item.judgment === '不合格'; }).length;

            document.getElementById('generateTitle').innerText = '一键生成全部附件';
            document.getElementById('generateInfo').innerHTML = '<p>正在生成全部附件...</p>' +
                '<p>合格样品信息表：' + qualifiedCount + '条</p>' +
                '<p>不合格样品信息表：' + unqualifiedCount + '条</p>' +
                '<p>信用归集表：' + unqualifiedCount + '条</p>' +
                '<p>信息核对表：' + sampleData.length + '条</p>';
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('generateStatus').innerText = '生成中...';
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('generateModal').classList.add('show');

            var progress = 0;
            var interval = setInterval(function() {
                progress += 8;
                document.getElementById('progressBar').style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    document.getElementById('generateStatus').innerText = '全部附件生成完成！';
                    document.getElementById('downloadBtn').style.display = 'inline-block';
                }
            }, 200);
        }

        function closeGenerateModal() {
            document.getElementById('generateModal').classList.remove('show');
        }

        function downloadAttachment() {
            alert('附件下载功能开发中');
            closeGenerateModal();
        }

        function exportData() {
            alert('导出功能开发中');
        }

        init();
    </script>
</body>
</html>
