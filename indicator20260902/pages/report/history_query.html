<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史报送信息综合查询</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .filter-section {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 15px;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-item label {
            font-weight: 500;
            min-width: 100px;
        }
        .filter-item input, .filter-item select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #1890ff;
            color: #fff;
        }
        .btn-primary:hover {
            background: #40a9ff;
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-left: 10px;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .btn-success {
            background: #52c41a;
            color: #fff;
        }
        .table-container {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .table-scroll {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 500px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            background: #fafafa;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        tr:hover {
            background: #f5f5f5;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-completed {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .status-partial {
            background: #fff7e6;
            color: #fa8c16;
            border: 1px solid #ffd591;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: #fff;
            border-radius: 8px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex: 0 0 auto;
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
        }
        .modal-close {
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #666;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1 1 auto;
        }
        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex: 0 0 auto;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
        }
        .info-label {
            font-weight: 500;
            color: #666;
            width: 30%;
        }
        .info-value {
            color: #333;
            width: 70%;
        }
        .tab-section {
            margin-top: 20px;
        }
        .tab-header {
            display: flex;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }
        .tab-item {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.3s;
        }
        .tab-item.active {
            border-bottom-color: #1890ff;
            color: #1890ff;
            font-weight: 600;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .content-box {
            background: #fafafa;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .content-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        .content-text {
            color: #666;
            line-height: 1.6;
        }
        .stats-row {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
        }
        .stat-box {
            padding: 15px 25px;
            background: #fafafa;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: #1890ff;
        }
        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        .role-tag {
            display: inline-block;
            padding: 5px 12px;
            background: #e6f7ff;
            color: #1890ff;
            border-radius: 4px;
            font-size: 13px;
            margin-right: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="filter-section">
        <div class="filter-row">
            <div class="filter-item">
                <label>报送部门：</label>
                <select id="deptName">
                    <option value="">全部</option>
                    <option value="东城区市场监管局">东城区市场监管局</option>
                    <option value="西城区市场监管局">西城区市场监管局</option>
                    <option value="朝阳区市场监管局">朝阳区市场监管局</option>
                    <option value="海淀区市场监管局">海淀区市场监管局</option>
                    <option value="丰台区市场监管局">丰台区市场监管局</option>
                </select>
            </div>
            <div class="filter-item">
                <label>任务年度：</label>
                <select id="taskYear">
                    <option value="">全部</option>
                    <option value="2026">2026年</option>
                    <option value="2025">2025年</option>
                    <option value="2024">2024年</option>
                </select>
            </div>
            <div class="filter-item">
                <label>报送时间段：</label>
                <input type="date" id="startDate">
                <span>至</span>
                <input type="date" id="endDate">
            </div>
        </div>
        <div class="filter-row">
            <button class="btn btn-primary" onclick="searchData()">查询</button>
            <button class="btn btn-secondary" onclick="resetFilter()">重置</button>
            <button class="btn btn-success" onclick="exportData()">导出台账</button>
        </div>
    </div>

    <div class="table-container">
        <div class="table-header">
            <h3>历史报送信息列表</h3>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>序号</th>
                        <th>报送批次号</th>
                        <th>部门名称</th>
                        <th>任务年度</th>
                        <th>提交时间</th>
                        <th>填报完成状态</th>
                        <th>版本号</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="reportTable">
                </tbody>
            </table>
        </div>
    </div>

    <div id="detailModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">报送详情</div>
                <div class="modal-close" onclick="closeDetailModal()">×</div>
            </div>
            <div class="modal-body" id="detailContent">
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeDetailModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        var reportData = [
            {
                id: 1,
                batchNo: 'BS2026001',
                deptName: '东城区市场监管局',
                taskYear: '2026',
                submitTime: '2026-01-15 10:30',
                status: '已完成',
                version: 'V1.0',
                supervision: { planCount: 1000, actualCount: 950 },
                risk: { planCount: 300, actualCount: 280 },
                summary: {
                    achievement: '上半年完成抽检任务800批次，发现不合格样品32批次，合格率96%。开展专项整治行动5次，查处违法案件28起。',
                    problems: '部分食品生产企业配合度不高，抽检样品采集难度较大。',
                    experience: '建立企业信用评价机制，对配合度高的企业减少抽检频次。'
                },
                plan: {
                    thought: '以风险防控为核心，进一步强化食品安全抽检监测工作。',
                    focus: '加强高风险食品品类抽检；加大网络食品抽检力度；深化部门协作机制。',
                    basis: '基于2026年抽检数据，问题食品主要集中在肉制品、水产品等品类。'
                }
            },
            {
                id: 2,
                batchNo: 'BS2026002',
                deptName: '西城区市场监管局',
                taskYear: '2026',
                submitTime: '2026-01-16 14:20',
                status: '已完成',
                version: 'V1.1',
                supervision: { planCount: 800, actualCount: 780 },
                risk: { planCount: 250, actualCount: 240 },
                summary: {
                    achievement: '上半年完成抽检任务650批次，发现不合格样品25批次，合格率96.2%。',
                    problems: '监管人员数量不足，日常监管与抽检任务冲突。',
                    experience: '推行网格化监管模式，合理分配监管力量。'
                },
                plan: {
                    thought: '围绕"四个最严"要求，全面提升食品安全监管水平。',
                    focus: '开展校园周边食品安全专项整治；强化餐饮服务单位监管；推进企业诚信体系建设。',
                    basis: '根据上级部门工作部署和辖区食品安全形势分析制定。'
                }
            },
            {
                id: 3,
                batchNo: 'BS2026003',
                deptName: '朝阳区市场监管局',
                taskYear: '2026',
                submitTime: '2026-01-17 09:15',
                status: '部分完成',
                version: 'V1.0',
                supervision: { planCount: 1200, actualCount: 1100 },
                risk: { planCount: 0, actualCount: 0 },
                summary: { achievement: '', problems: '', experience: '' },
                plan: { thought: '', focus: '', basis: '' }
            },
            {
                id: 4,
                batchNo: 'BS2025001',
                deptName: '东城区市场监管局',
                taskYear: '2025',
                submitTime: '2025-01-18 11:00',
                status: '已完成',
                version: 'V2.0',
                supervision: { planCount: 900, actualCount: 880 },
                risk: { planCount: 280, actualCount: 265 },
                summary: {
                    achievement: '全年完成抽检任务1800批次，发现不合格样品72批次，合格率96%。',
                    problems: '部分检验项目周期较长，影响工作效率。',
                    experience: '优化检验项目组合，提高工作效率。'
                },
                plan: {
                    thought: '以创建食品安全示范区为目标，全面提升食品安全保障能力。',
                    focus: '完善抽检监测体系；加强风险预警能力；强化应急处置机制。',
                    basis: '根据市食安委工作要求和辖区实际情况制定。'
                }
            },
            {
                id: 5,
                batchNo: 'BS2025002',
                deptName: '西城区市场监管局',
                taskYear: '2025',
                submitTime: '2025-01-19 15:30',
                status: '已完成',
                version: 'V1.0',
                supervision: { planCount: 750, actualCount: 720 },
                risk: { planCount: 230, actualCount: 220 },
                summary: { achievement: '完成年度抽检任务目标。', problems: '经费不足。', experience: '争取财政支持。' },
                plan: { thought: '持续加强食品安全监管。', focus: '加强重点领域监管。', basis: '根据年度工作部署。' }
            }
        ];

        function init() {
            renderTable(reportData);
        }

        function renderTable(data) {
            var tbody = document.getElementById('reportTable');
            tbody.innerHTML = '';
            data.forEach(function(item, index) {
                var statusClass = item.status === '已完成' ? 'status-completed' : 'status-partial';

                var row = '<tr>' +
                    '<td>' + (index + 1) + '</td>' +
                    '<td>' + item.batchNo + '</td>' +
                    '<td>' + item.deptName + '</td>' +
                    '<td>' + item.taskYear + '年</td>' +
                    '<td>' + item.submitTime + '</td>' +
                    '<td><span class="status-tag ' + statusClass + '">' + item.status + '</span></td>' +
                    '<td>' + item.version + '</td>' +
                    '<td>' +
                    '<button class="btn btn-primary" onclick="viewDetail(' + item.id + ')" style="padding: 4px 10px; font-size: 12px;">查看详情</button>' +
                    '</td>' +
                    '</tr>';
                tbody.innerHTML += row;
            });
        }

        function searchData() {
            var dept = document.getElementById('deptName').value;
            var year = document.getElementById('taskYear').value;
            var startDate = document.getElementById('startDate').value;
            var endDate = document.getElementById('endDate').value;

            var filtered = reportData.filter(function(item) {
                var match = true;
                if (dept && item.deptName !== dept) match = false;
                if (year && item.taskYear !== year) match = false;
                if (startDate && item.submitTime.split(' ')[0] < startDate) match = false;
                if (endDate && item.submitTime.split(' ')[0] > endDate) match = false;
                return match;
            });
            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById('deptName').value = '';
            document.getElementById('taskYear').value = '';
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            renderTable(reportData);
        }

        function viewDetail(id) {
            var item = reportData.find(function(i) { return i.id === id; });
            if (item) {
                var supervisionRate = item.supervision.planCount > 0 ? Math.round((item.supervision.actualCount / item.supervision.planCount) * 100) : 0;
                var riskRate = item.risk.planCount > 0 ? Math.round((item.risk.actualCount / item.risk.planCount) * 100) : 0;

                var html = '<div class="info-row"><span class="info-label">报送批次号：</span><span class="info-value">' + item.batchNo + '</span></div>' +
                    '<div class="info-row"><span class="info-label">部门名称：</span><span class="info-value">' + item.deptName + '</span></div>' +
                    '<div class="info-row"><span class="info-label">任务年度：</span><span class="info-value">' + item.taskYear + '年</span></div>' +
                    '<div class="info-row"><span class="info-label">提交时间：</span><span class="info-value">' + item.submitTime + '</span></div>' +
                    '<div class="info-row"><span class="info-label">填报状态：</span><span class="info-value">' + item.status + '</span></div>' +
                    '<div class="info-row"><span class="info-label">版本号：</span><span class="info-value">' + item.version + '</span></div>';

                html += '<div class="tab-section">' +
                    '<div class="tab-header">' +
                    '<div class="tab-item active" onclick="switchDetailTab(1)">监督抽检数据</div>' +
                    '<div class="tab-item" onclick="switchDetailTab(2)">风险监测数据</div>' +
                    '<div class="tab-item" onclick="switchDetailTab(3)">工作总结</div>' +
                    '<div class="tab-item" onclick="switchDetailTab(4)">工作计划</div>' +
                    '</div>';

                html += '<div class="tab-content active" id="tab1">' +
                    '<div class="stats-row">' +
                    '<div class="stat-box"><div class="stat-value">' + item.supervision.planCount + '</div><div class="stat-label">计划数</div></div>' +
                    '<div class="stat-box"><div class="stat-value">' + item.supervision.actualCount + '</div><div class="stat-label">完成数</div></div>' +
                    '<div class="stat-box"><div class="stat-value">' + supervisionRate + '%</div><div class="stat-label">完成率</div></div>' +
                    '</div>' +
                    '</div>';

                html += '<div class="tab-content" id="tab2">' +
                    '<div class="stats-row">' +
                    '<div class="stat-box"><div class="stat-value">' + item.risk.planCount + '</div><div class="stat-label">计划数</div></div>' +
                    '<div class="stat-box"><div class="stat-value">' + item.risk.actualCount + '</div><div class="stat-label">完成数</div></div>' +
                    '<div class="stat-box"><div class="stat-value">' + riskRate + '%</div><div class="stat-label">完成率</div></div>' +
                    '</div>' +
                    '</div>';

                html += '<div class="tab-content" id="tab3">' +
                    '<div class="content-box"><div class="content-title">工作成效</div><div class="content-text">' + (item.summary.achievement || '未填报') + '</div></div>' +
                    '<div class="content-box"><div class="content-title">遇到问题</div><div class="content-text">' + (item.summary.problems || '未填报') + '</div></div>' +
                    '<div class="content-box"><div class="content-title">典型经验</div><div class="content-text">' + (item.summary.experience || '未填报') + '</div></div>' +
                    '</div>';

                html += '<div class="tab-content" id="tab4">' +
                    '<div class="content-box"><div class="content-title">工作思路</div><div class="content-text">' + (item.plan.thought || '未填报') + '</div></div>' +
                    '<div class="content-box"><div class="content-title">重点方向</div><div class="content-text">' + (item.plan.focus || '未填报') + '</div></div>' +
                    '<div class="content-box"><div class="content-title">目标设定依据</div><div class="content-text">' + (item.plan.basis || '未填报') + '</div></div>' +
                    '</div>';

                html += '</div>';

                document.getElementById('detailContent').innerHTML = html;
                document.getElementById('detailModal').classList.add('show');
            }
        }

        function switchDetailTab(tabIndex) {
            document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            document.querySelectorAll('.tab-item')[tabIndex - 1].classList.add('active');
            document.getElementById('tab' + tabIndex).classList.add('active');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        function exportData() {
            alert('导出台账功能开发中');
        }

        init();
    </script>
</body>
</html>
